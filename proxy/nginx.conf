map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. Default server to drop unknown Hosts
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    return 444; # Connection Closed Without Response
}

# 2. Main Server Block (Explicitly accepting intended Hosts)
server {
    listen 80;
    # Allow localhost, IP, and local dev domain. In prod this would be the actual domain.
    server_name localhost 127.0.0.1 honeyshield.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost 127.0.0.1 honeyshield.local;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Strong TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log off;

    # Hardened Request Limits
    client_max_body_size 1M;
    large_client_header_buffers 4 16k;
    client_header_buffer_size 2k;

    # Hardened Timeouts (Slowloris protection)
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 65s;
    send_timeout 10s;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        # Security: ensure proxy accurately asserts the original protocol and client
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Buffer tuning to mitigate slow-client attacks, while preserving SSE
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;

        # Keep timeouts long enough for WebSockets / SSE
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
